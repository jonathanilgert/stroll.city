name: Deploy stroll.city

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stroll-city-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build

      - name: Install SSH key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.STROLL_DEPLOY_SSH_KEY }}" > ~/.ssh/stroll_city_deploy
          chmod 600 ~/.ssh/stroll_city_deploy
          printf '%s\n' "${{ secrets.STROLL_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create release directory
        env:
          DEPLOY_HOST: ${{ secrets.STROLL_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STROLL_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.STROLL_DEPLOY_PORT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stroll_city_deploy -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p /var/www/stroll.city/releases/${RELEASE_ID} /var/www/stroll.city/shared/.stroll"

      - name: Upload source to release
        env:
          DEPLOY_HOST: ${{ secrets.STROLL_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STROLL_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.STROLL_DEPLOY_PORT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'app/node_modules/' \
            --exclude 'app/.next/' \
            --exclude 'app/out/' \
            --exclude 'app/.stroll/' \
            -e "ssh -i ~/.ssh/stroll_city_deploy -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/stroll.city/releases/${RELEASE_ID}/"

      - name: Build and activate release on server
        env:
          DEPLOY_HOST: ${{ secrets.STROLL_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STROLL_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.STROLL_DEPLOY_PORT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stroll_city_deploy -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "RELEASE_ID='${RELEASE_ID}' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_ROOT=/var/www/stroll.city
          RELEASE_DIR="${APP_ROOT}/releases/${RELEASE_ID}"
          SHARED_DIR="${APP_ROOT}/shared"

          cd "${RELEASE_DIR}/app"
          rm -rf .stroll
          mkdir -p "${SHARED_DIR}/.stroll"
          ln -s "${SHARED_DIR}/.stroll" .stroll

          # Re-running a deploy for the same SHA can leave a partial node_modules
          # behind because the upload intentionally excludes dependencies.
          # Start dependency/build artifacts clean so npm ci is deterministic.
          rm -rf node_modules .next
          npm ci
          npm run build

          chown -R www-data:www-data "${RELEASE_DIR}"
          ln -sfn "${RELEASE_DIR}" "${APP_ROOT}/current"

          systemctl restart stroll-city.service
          systemctl is-active --quiet stroll-city.service
          nginx -t
          systemctl reload nginx

          find "${APP_ROOT}/releases" -mindepth 1 -maxdepth 1 -type d \
            -printf '%T@ %p\n' | sort -rn | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

      - name: Verify production
        env:
          DEPLOY_HOST: ${{ secrets.STROLL_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STROLL_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.STROLL_DEPLOY_PORT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stroll_city_deploy -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test \"\$(readlink -f /var/www/stroll.city/current)\" = \"/var/www/stroll.city/releases/${RELEASE_ID}\""
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 20 https://stroll.city/ >/tmp/stroll-home.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production home page did not become ready in time" >&2
              exit 1
            fi
            sleep 2
          done
          grep -qi 'stroll' /tmp/stroll-home.html

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 20 https://stroll.city/api/v1/calgary/businesses >/tmp/stroll-businesses.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production businesses API did not become ready in time" >&2
              exit 1
            fi
            sleep 2
          done
          grep -q '"ok":true' /tmp/stroll-businesses.json
          grep -q '"data"' /tmp/stroll-businesses.json
